<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ subject|default:"Nyx" }}</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f6f7fb; color: #1f2937; font-family: Arial, sans-serif;">
    <span style="display: none; max-height: 0; overflow: hidden; opacity: 0;">
      {{ preview_text|default:"A message from Nyx." }}
    </span>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background: #f6f7fb; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 600px;">
            <tr>
              <td style="padding: 0 0 16px; color: #111827; font-size: 22px; font-weight: 700; letter-spacing: -0.4px;">
                {{ app_name|default:"Nyx" }}
              </td>
            </tr>
            <tr>
              <td style="background: #ffffff; border-radius: 12px; padding: 32px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 8px 0; color: #6b7280; font-size: 13px; line-height: 20px; text-align: center;">
                This email was sent by {{ app_name|default:"Nyx" }}.<br />
                {% block footer %}Please do not reply to this email.{% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
